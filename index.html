<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Prépa Santé — Concours 2026</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root{--p1:#0f766e;--p1d:#115e59;--p1l:#14b8a6;--p2:#0891b2;--ac:#f97316;--ok:#059669;--ko:#dc2626;--ink:#0a1f1e;--mute:#64748b;--line:#e2e8f0;--line2:#f1f5f9;--card:#fff;--sh1:0 4px 12px rgba(10,31,30,.05);--sh2:0 10px 30px rgba(10,31,30,.1);}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
  body{color:var(--ink);min-height:100vh;background:radial-gradient(1200px 700px at -10% -10%, #ccfbf1 0%, transparent 55%),radial-gradient(900px 500px at 110% 0%, #cffafe 0%, transparent 50%),#f7fbfa;line-height:1.6;overflow-x:hidden}
  
  /* Header */
  header{position:sticky;top:0;z-index:50;background:rgba(10,79,74,0.95);backdrop-filter:blur(10px);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(15,118,110,.3);flex-wrap:wrap}
  header .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#14b8a6,#0891b2);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.2)}
  header .logo svg{width:26px;height:26px}
  header h1{font-size:1rem;font-weight:800;letter-spacing:-.3px}
  header p{font-size:.7rem;opacity:.85}
  .tools{margin-inline-start:auto;display:flex;gap:6px;background:rgba(255,255,255,.15);padding:4px;border-radius:10px}
  .tools button{background:transparent;border:none;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:800;font-size:.85rem;transition:.2s}
  .tools button.on{background:#fff;color:var(--p1)}
  .tools button:hover:not(.on){background:rgba(255,255,255,.25)}

  /* Views & Anim */
  main{max-width:900px;margin:0 auto;padding:20px}
  .view{display:none;animation:fadeUp .4s ease}
  .view.active{display:block}
  @keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

  /* Cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .card{background:var(--card);border-radius:20px;padding:20px;cursor:pointer;border:1px solid var(--line);display:flex;gap:16px;align-items:center;position:relative;box-shadow:var(--sh1);transition:all .3s}
  .card:hover{transform:translateY(-4px);box-shadow:var(--sh2);border-color:var(--p1l)}
  .card .ic{width:54px;height:54px;flex-shrink:0;border-radius:14px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 15px rgba(15,118,110,.2)}
  .card .ic svg{width:28px;height:28px}
  .card h3{font-size:1.05rem;font-weight:800;color:var(--ink);margin-bottom:2px}
  .card p{font-size:.8rem;color:var(--mute)}
  .badge{position:absolute;top:12px;right:12px;background:#e0f2fe;color:var(--p2);font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:20px}

  /* Quiz Panel */
  .panel{background:var(--card);border-radius:24px;padding:24px;border:1px solid var(--line);box-shadow:var(--sh2);position:relative;overflow:hidden}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .back{background:var(--line2);border:none;color:var(--ink);padding:8px 14px;border-radius:10px;font-weight:700;cursor:pointer;font-size:.85rem;transition:.2s}
  .back:hover{background:#fff;border:1px solid var(--p1l);color:var(--p1)}
  .prog{font-size:.85rem;font-weight:800;color:var(--p2)}
  .progress-bar{width:100%;height:6px;background:var(--line2);border-radius:10px;margin-bottom:20px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--p1),var(--p2));border-radius:10px;transition:width .3s ease}
  
  .qtxt{font-size:1.1rem;font-weight:700;margin:12px 0 20px;padding:18px;background:#f0fdfa;border-radius:14px;border-left:4px solid var(--p1l);line-height:1.6}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{background:#fbfdfd;border:1.5px solid var(--line);border-radius:12px;padding:14px 18px;cursor:pointer;display:flex;gap:12px;align-items:center;font-size:.95rem;transition:.2s}
  .opt:hover:not(.dis){border-color:var(--p1l);background:#fff;transform:translateX(4px)}
  .opt .ltr{width:30px;height:30px;border-radius:8px;background:var(--line2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--p1);flex-shrink:0}
  .opt.ok{background:#dcfce7;border-color:var(--ok)}
  .opt.ok .ltr{background:var(--ok);color:#fff}
  .opt.ko{background:#fee2e2;border-color:var(--ko)}
  .opt.ko .ltr{background:var(--ko);color:#fff}
  .opt.dis{cursor:default;pointer-events:none}

  .exp{margin-top:18px;padding:16px;background:#fef3c7;border-left:4px solid #f59e0b;border-radius:12px;font-size:.9rem;display:none;color:#78350f}
  .exp.on{display:block;animation:fadeUp .3s ease}
  
  .nav{display:flex;gap:10px;margin-top:24px;justify-content:space-between}
  .btn{padding:12px 24px;border:none;border-radius:12px;font-weight:800;cursor:pointer;transition:.2s;font-size:.9rem}
  .bp{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:0 4px 15px rgba(15,118,110,.3)}
  .bp:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(15,118,110,.4)}
  .bs{background:var(--line2);color:var(--ink)}
  .bs:hover{background:#fff;border:1px solid var(--p1l);color:var(--p1)}

  /* Score */
  .score-box{text-align:center;padding:30px 20px}
  .score-circle{width:160px;height:160px;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:900;color:#fff;position:relative;background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 10px 30px rgba(15,118,110,.3)}
  .score-msg{font-size:1rem;font-weight:700;margin-bottom:20px;color:var(--ink2)}

  /* Welcome & Splash */
  #vSplash{position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#0a4f4a,#0f766e,#0891b2);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
  #vSplash.hidden{opacity:0;pointer-events:none}
  .splash-logo{width:100px;height:100px;border-radius:24px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;margin-bottom:20px;animation:pop .5s ease}
  .splash-logo svg{width:50px;height:50px}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .splash-title{color:#fff;font-size:1.5rem;font-weight:900}
  
  #photoModal{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.9);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  #photoModal.on{display:flex}
  #photoPreview{max-width:100%;max-height:80vh;border-radius:12px}
  .close-photo{margin-top:20px;padding:12px 24px;background:var(--ac);color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer}

  @media(max-width:600px){
    .card{padding:16px}
    .panel{padding:18px}
    .qtxt{font-size:1rem;padding:14px}
    .opt{padding:12px}
  }
</style>
</head>
<body>

<div id="vSplash">
  <div class="splash-logo">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.5-9-9c-1.3-3 1-7 4.5-7 2 0 3.5 1 4.5 3 1-2 2.5-3 4.5-3C20 5 22.3 9 21 12c-2 4.5-9 9-9 9z" fill="#fff"/></svg>
  </div>
  <div class="splash-title">Prépa Santé</div>
</div>

<div id="appRoot" style="display:none">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.5-9-9c-1.3-3 1-7 4.5-7 2 0 3.5 1 4.5 3 1-2 2.5-3 4.5-3C20 5 22.3 9 21 12c-2 4.5-9 9-9 9z" fill="#fff"/></svg>
    </div>
    <div class="titles">
      <h1>Prépa Santé</h1>
      <p>Concours 2026</p>
    </div>
    <div class="tools">
      <button id="bFr" class="on" onclick="setLang('fr')">FR</button>
      <button id="bAr" onclick="setLang('ar')">ع</button>
      <button onclick="shareApp()" title="Partager">📤</button>
      <button onclick="document.getElementById('camInput').click()" title="Camera">📸</button>
      <button onclick="askNotif()" title="Notif">🔔</button>
    </div>
    <input type="file" accept="image/*" capture="environment" id="camInput" style="display:none" onchange="handlePhoto(this)">
  </header>

  <main>
    <!-- Branches -->
    <section id="vBranch" class="view active">
      <div class="cards" id="cBranch"></div>
    </section>

    <!-- Levels -->
    <section id="vLevel" class="view">
      <div class="panel">
        <div class="top">
          <button class="back" onclick="go('vBranch')">← Retour</button>
          <span class="prog" id="lblSubj"></span>
        </div>
        <div class="cards" id="cLevel"></div>
      </div>
    </section>

    <!-- Quiz -->
    <section id="vQuiz" class="view">
      <div class="panel">
        <div class="top">
          <button class="back" onclick="go('vLevel')">← Retour</button>
          <span class="prog" id="progTxt">0 / 0</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
        <div class="qtxt" id="qTxt"></div>
        <div class="opts" id="optBox"></div>
        <div class="exp" id="expBox"></div>
        <div class="nav">
          <button class="btn bs" id="btnPrev" onclick="prevQ()">Précédent</button>
          <button class="btn bp" id="btnNext" onclick="nextQ()">Suivant</button>
        </div>
      </div>
    </section>

    <!-- Score -->
    <section id="vScore" class="view">
      <div class="panel score-box">
        <div class="score-circle" id="scoreNum">0%</div>
        <div class="score-msg" id="scoreMsg"></div>
        <button class="btn bp" onclick="retry()">Refaire</button>
        <button class="btn bs" onclick="go('vLevel')" style="margin-left:8px">Autres</button>
      </div>
    </section>
  </main>
</div>

<div id="photoModal">
  <img id="photoPreview" src="">
  <button class="close-photo" onclick="document.getElementById('photoModal').classList.remove('on')">Fermer</button>
</div>

  activity:'<svg viewBox="0 0 24 24" fill="none"><path d="M3 12h4l3-8 4 16 3-8h4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  pulse:'<svg viewBox="0 0 24 24" fill="none"><path d="M2 12h4l2-6 4 12 2-6h8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none"><path d="M16 14a4 4 0 10-4-4 4 4 0 004 4zm-8 0a3 3 0 10-3-3 3 3 0 003 3zm8 6v-1c0-2.2-1.8-4-4-4s-4 1.8-4 4v1h8zm-8 0v-1c0-1.7-.7-3.2-1.8-4.3A5 5 0 002 19v1h6z" fill="currentColor"/></svg>'
};

  fr:{ heroBadge:"Édition 2026", heroTitle:'Réussis ton concours<br><span class="grad">avec méthode</span>', heroSub:"Questions type concours après Bac — corrigées, expliquées.", statsQ:"questions", statsM:"matières", statsL:"niveaux", stLevel:"Choisissez un niveau", backBranch:"Retour", backLevel:"Retour", prev:"Précédent", next:"Suivant", finish:"Voir les résultats", resTitle:"Résultats", retry:"Refaire", other:"Autres niveaux", info:"Vos réponses sont enregistrées.", correct:"Correct.", correctIs:"Réponse correcte", qLabel:"Q", r80:"Excellent !", r60:"Bon niveau.", r40:"Niveau moyen.", r0:"À consolider.", good:"bonnes réponses sur", answered:"répondues", levelsW:"niveaux", questionsW:"questions", answeredW:"répondues", done:"terminé", subTitle:"Préparation aux concours", credit:'Application créée par <span class="cr">Walid Ouhamou</span>' },
  ar:{ heroBadge:"نسخة 2026", heroTitle:'استعد لمباراتك<br><span class="grad">بمنهجية</span>', heroSub:"أسئلة مصححة ومشروحة.", statsQ:"سؤالًا", statsM:"مواد", statsL:"مستويات", stLevel:"اختر مستوى", backBranch:"رجوع", backLevel:"رجوع", prev:"السابق", next:"التالي", finish:"عرض النتائج", resTitle:"النتائج", retry:"إعادة", other:"مستويات أخرى", info:"إجاباتك تُحفظ.", correct:"صحيح.", correctIs:"الجواب الصحيح", qLabel:"س", r80:"ممتاز!", r60:"جيد.", r40:"متوسط.", r0:"يحتاج تعزيزًا.", good:"صحيحة من", answered:"مُجابة", levelsW:"مستويات", questionsW:"سؤالًا", answeredW:"مُجابة", done:"مكتمل", subTitle:"التحضير لمباريات الولوج", credit:'تطبيق من إنجاز <span class="cr">Walid Ouhamou</span>' }
};

const KEY = 'prepasante_v6';
let S = { lang:'fr', subject:null, level:null, index:0, answers:{}, progress:{} };

function load(){ try{ const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r)); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function subjectKey(){ return S.subject + '|' + S.level; }
function safeGetProgress(k){ if(!S.progress[k]) S.progress[k]={index:0,completed:false}; return S.progress[k]; }
function go(id){ document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo({top:0,behavior:'smooth'}); }

function setLang(l){ S.lang=l; save(); document.getElementById('bFr').classList.toggle('on',l==='fr'); document.getElementById('bAr').classList.toggle('on',l==='ar'); document.documentElement.lang=l; document.body.classList.toggle('ar',l==='ar'); applyUITexts(); if(document.getElementById('vBranch').classList.contains('active')) buildBranches(); else if(document.getElementById('vLevel').classList.contains('active')) buildLevels(); else if(document.getElementById('vQuiz').classList.contains('active')) renderQ(); else if(document.getElementById('vScore').classList.contains('active')) showScore(); }
function T(){ return UI[S.lang]; }
function applyUITexts(){ const t=T(); document.getElementById('bFr').textContent='FR'; document.getElementById('bAr').textContent='ع'; if(document.getElementById('vBranch').classList.contains('active')) buildBranches(); }

function buildBranches(){
  const c=document.getElementById('cBranch'); c.innerHTML='';
  Object.keys(DB).forEach(name=>{
    const s=DB[name]; const total=s.levels.reduce((a,l)=>a+l.qs.length,0);
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=`<span class="badge">${total} Q</span><div class="ic">${ICONS[s.icon]||ICONS.cross}</div><div style="flex:1"><h3>${name}</h3><p>${s.desc[S.lang]}</p></div>`;
    card.onclick=()=>{ S.subject=name; S.level=null; save(); go('vLevel'); document.getElementById('lblSubj').textContent=name; buildLevels(); };
    c.appendChild(card);
  });
}
function buildLevels(){
  const c=document.getElementById('cLevel'); c.innerHTML='';
  if(!S.subject||!DB[S.subject]){go('vBranch');return;}
  DB[S.subject].levels.forEach((lvl,i)=>{
    const k=S.subject+'|'+i; const ans=S.answers[k]||[]; const answered=ans.filter(a=>a!==null&&a!==undefined).length;
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=`<span class="badge">${lvl.qs.length} Q</span><div class="ic">${ICONS[DB[S.subject].icon]||ICONS.cross}</div><div style="flex:1"><h3>${lvl.name[S.lang]}</h3><p>${answered}/${lvl.qs.length} répondues</p></div>`;
    card.onclick=()=>startLevel(i); c.appendChild(card);
  });
}
function startLevel(i){
  if(!S.subject||!DB[S.subject])return; S.level=i; const k=subjectKey(); const total=DB[S.subject].levels[i].qs.length;
  if(!Array.isArray(S.answers[k])) S.answers[k]=new Array(total).fill(null);
  if(S.answers[k].length!==total){ const a=S.answers[k]; S.answers[k]=Array.from({length:total},(_,j)=>a[j]??null); safeGetProgress(k).completed=false; }
  const p=safeGetProgress(k); S.index=Math.min(Math.max(0,p.index||0),total-1); save();
  go('vQuiz'); renderQ();
}
function renderQ(){
  if(!S.subject||S.level===null||!DB[S.subject]){go('vBranch');return;}
  const t=T(); const lvl=DB[S.subject].levels[S.level]; const q=lvl.qs[S.index]; const total=lvl.qs.length;
  document.getElementById('progTxt').textContent=(S.index+1)+' / '+total;
  document.getElementById('progFill').style.width=((S.index+1)/total*100)+'%';
  document.getElementById('qTxt').textContent=(S.index+1)+'. '+q.q[S.lang];
  const c=document.getElementById('optBox'); c.innerHTML=''; const letters=['A','B','C','D','E','F'];
  q.o[S.lang].forEach((opt,i)=>{
    const d=document.createElement('div'); d.className='opt';
    d.innerHTML=`<span class="ltr">${letters[i]}</span><span>${opt}</span>`;
    d.onclick=()=>selectAns(i); c.appendChild(d);
  });
  document.getElementById('expBox').classList.remove('on'); document.getElementById('expBox').innerHTML='';
  const cur=S.answers[S.subject+'|'+S.level]?.[S.index]; if(cur!==null&&cur!==undefined) highlight(cur,false);
  document.getElementById('btnPrev').disabled=S.index===0;
  document.getElementById('btnNext').textContent=(S.index===total-1)?t.finish:t.next;
}
function selectAns(i){
  const k=subjectKey(); if(!S.answers[k]||S.answers[k][S.index]!==null)return;
  S.answers[k][S.index]=i; highlight(i,true); save();
}
function highlight(selected,scroll){
  const t=T(); const q=DB[S.subject].levels[S.level].qs[S.index]; const opts=document.querySelectorAll('#optBox .opt'); const letters=['A','B','C','D','E','F'];
  opts.forEach((o,i)=>{ o.classList.add('dis'); o.onclick=null; if(i===q.r) o.classList.add('ok'); else if(i===selected&&i!==q.r) o.classList.add('ko'); });
  const ok=selected===q.r;
  if(ok) vibratePhone(50); else vibratePhone([50,50,50]);
  const exp=document.getElementById('expBox'); exp.innerHTML=`<strong>${ok?t.correct:t.correctIs+' : '+letters[q.r]+'.'}</strong> ${q.e[S.lang]}`; exp.classList.add('on');
  if(scroll) setTimeout(()=>exp.scrollIntoView({behavior:'smooth',block:'nearest'}),80);
}
function nextQ(){
  const k=subjectKey(); const lvl=DB[S.subject]?.levels?.[S.level]; if(!lvl)return;
  if(S.index<lvl.qs.length-1){ S.index++; safeGetProgress(k).index=S.index; save(); renderQ(); } else { safeGetProgress(k).completed=true; save(); showScore(); }
}
function prevQ(){ if(S.index>0){ S.index--; safeGetProgress(subjectKey()).index=S.index; save(); renderQ(); } }

function showScore(){
  if(!S.subject||S.level===null||!DB[S.subject]){go('vBranch');return;}
  const t=T(); go('vScore'); const k=subjectKey(); const qs=DB[S.subject].levels[S.level].qs; const ans=S.answers[k]||[];
  let ok=0,answ=0; ans.forEach((a,i)=>{ if(a!==null&&a!==undefined){ answ++; if(a===qs[i].r) ok++; } });
  const pct=qs.length?Math.round((ok/qs.length)*100):0;
  document.getElementById('scoreNum').textContent=pct+'%';
  let r=''; if(pct>=80) r=t.r80; else if(pct>=60) r=t.r60; else if(pct>=40) r=t.r40; else r=t.r0;
  document.getElementById('scoreMsg').textContent=`${ok}/${qs.length} - ${r}`;
}
function retry(){
  const k=subjectKey(); if(!DB[S.subject]?.levels?.[S.level])return; const total=DB[S.subject].levels[S.level].qs.length;
  S.answers[k]=new Array(total).fill(null); S.progress[k]={index:0,completed:false}; S.index=0; save();
  go('vQuiz'); renderQ();
}

   NATIVE FEATURES
   ========================================================== */
function vibratePhone(pattern) { if ("vibrate" in navigator) navigator.vibrate(pattern); }
function shareApp() {
  const data = { title: 'Prépa Santé', text: 'Prépare ton concours avec Prépa Santé !', url: 'https://walidouh12.github.io/prepasante/' };
  if (navigator.share) navigator.share(data).catch(console.error); else alert("Partage non supporté.");
}
function shareScore(score) {
  const data = { title: 'Prépa Santé', text: `J'ai eu ${score} au quiz ! Essaie aussi.`, url: 'https://walidouh12.github.io/prepasante/' };
  if (navigator.share) navigator.share(data).catch(console.error); else alert(`J'ai eu ${score} !`);
}
function handlePhoto(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('photoPreview').src = e.target.result;
      document.getElementById('photoModal').classList.add('on');
    };
    reader.readAsDataURL(input.files[0]);
  }
  input.value = '';
}
function askNotif() {
  if (!("Notification" in window)) { alert("Non supporté."); return; }
  Notification.requestPermission().then((permission) => {
    if (permission === "granted") {
      if (navigator.serviceWorker && navigator.serviceWorker.ready) {
        navigator.serviceWorker.ready.then((reg) => {
          reg.showNotification("Prépa Santé ⏰", { body: "C'est l'heure de réviser !", icon: "icons/icon-192.png", vibrate: [200, 100, 200] });
        });
      }
    } else { alert("Veuillez autoriser les notifications."); }
  });
}
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.log('SW err', err)); }); }

/* INIT */
(function init(){
  load();
  setTimeout(()=>{
    document.getElementById('vSplash').classList.add('hidden');
    document.getElementById('appRoot').style.display='block';
    setLang(S.lang);
    applyUITexts();
  }, 1000);
})();
</script>
